site_name: 'JumpServer 文档'
site_url: 'https://docs.jumpserver.org'
site_author: '飞致云'
site_description: "JumpServer 在线文档"

repo_name: 'jumpserver/jumpserver'
repo_url: 'https://github.com/jumpserver/jumpserver'
edit_uri: ''

theme:
  name: 'material'
  logo: 'img/logo.png'
  favicon: 'img/favicon.ico'
  language: 'zh'
  palette:
    - scheme: default
      accent: 'red'
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      accent: 'red'
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
  font: false
  custom_dir: 'theme'
  icon:
    repo: fontawesome/brands/github

nav:
  - 产品介绍: index.md
  - 版本对比: https://jumpserver.org/features.html 
  - 快速入门: quick_start.md
  - 安装部署:
    - Linux 单机部署:
        - 环境要求: installation/setup_linux_standalone/requirements.md
        - 安装指南: installation/setup_linux_standalone/offline_install.md
        - 升级指南: installation/setup_linux_standalone/offline_upgrade.md
    - Linux 集群模式部署:
        - 准备工作: installation/setup_linux_lb/requirements.md
        - 部署 NFS 服务: installation/setup_linux_lb/nfs_install.md
        - 部署 PostgreSQL 服务: installation/setup_linux_lb/pgsql_install.md
        - 部署 Redis 服务: installation/setup_linux_lb/redis_install.md
        - 部署 JumpServer 01 节点: installation/setup_linux_lb/installation_node01.md
        - 部署 JumpServer 02 节点: installation/setup_linux_lb/installation_node02.md
        - 部署 HAProxy 服务: installation/setup_linux_lb/haproxy_install.md
        - 部署 MinIO 服务: installation/setup_linux_lb/minio_install.md
        - 部署 Elasticsearch 服务: installation/setup_linux_lb/elasticsearch_install.md
        - 注意事项: installation/setup_linux_lb/linux_lb_upgrade.md
    - 1Panel 模式部署:
        - 安装指南: installation/1panel_setup/setup_js.md
        - 运维指南: installation/1panel_setup/config_js.md
    - Kubernetes  Helm 模式部署:
        - 安装指南: installation/setup_kubernetes/helm_online_install.md
        - 升级指南: installation/setup_kubernetes/helm_online_upgrade.md
    - 网络端口说明: installation/network_port.md  
    - 数据备份以及恢复指南: installation/backup_recovery.md
